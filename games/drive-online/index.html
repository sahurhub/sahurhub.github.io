<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b10; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .msg { height: 100%; display: grid; place-content: center; text-align: center; padding: 16px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="msg" id="msg">Loading...</div>
  <script>
    /*
      Drive Online (the game is "Driver Online Cars" by VayGame) is not stored in this
      repository. Someone else published its web version on GitHub
      (nihathatpsin/seymaynem, served by jsDelivr) as an XML file with the game's
      web page inside. This page downloads that file and shows the page inside it
      (the same file the Google Sites page "Classroom Center - Drive Online" uses,
      without that site's ad script).

      VERSION locks every file to one version of that GitHub project, so its
      owner can't change what runs here later. The game page asks for its files
      with "@main", so those are swapped for the same locked version.

      The loading screen shows SahurHub's Drive Online cover instead of the
      uploader's "Unblocked Games G+" picture and logo.
    */
    (function () {
      var VERSION = 'f7c45dd7a9a0b3f2c77d6cfa25718bbed725e113';
      var BASE = 'https://cdn.jsdelivr.net/gh/nihathatpsin/seymaynem@';
      var msg = document.getElementById('msg');

      fetch(BASE + VERSION + '/1.xml')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (xml) {
          var start = xml.indexOf('<![CDATA[');
          var end = xml.lastIndexOf(']]>');
          if (start < 0 || end < start) throw new Error('Unexpected file');
          var cover = new URL('../../covers/drive-online.jpg', location.href).href;
          var html = xml.slice(start + 9, end)
            .split(BASE + 'main/background.png').join(cover)
            .split(BASE + 'main').join(BASE + VERSION)
            .replace('</head>', '<title>Test</title><style>#unity-logo { display: none; }</style></head>');
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          msg.textContent = 'The game could not load. Check your connection and try again.';
        });
    })();
  </script>
</body>
</html>
