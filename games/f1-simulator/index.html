<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Simulator - SahurHub</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <!-- The game's files (34 MB of 3D models) are too big for this repository's
       uploads, so they live on the SahurHub server and show here full screen. -->
  <iframe id="game" src="https://games-79-72-86-205.sslip.io/f1-simulator/" title="F1 Simulator"
    allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen></iframe>
  <script>
    // Pass ?mute through, and give the game the keyboard straight away.
    var f = document.getElementById('game');
    if (location.search.indexOf('mute') !== -1) f.src += '?mute';
    f.addEventListener('load', function () { f.focus(); });
  </script>
</body>
