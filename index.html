<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SahurHub</title>
  <meta name="description" content="SahurHub is coming soon.">
  <style>
    :root {
      --bg: #f6f6f4;
      --text: #1d1d1f;
      --muted: #6b6b70;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --text: #f2f2f4;
        --muted: #9a9aa2;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    p.name {
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p class="name">SahurHub</p>
    <h1>Coming soon</h1>
  </main>
</body>
</html>
