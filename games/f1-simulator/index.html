<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Simulator</title>
  <meta name="description" content="Unofficial browser Formula 1 simulator. Fan project, not affiliated with Formula 1, the FIA or any team.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/hud.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="hud" class="hidden"></div>
  <div id="ui"></div>
  <div id="loading" class="hidden">
    <div class="loading-box">
      <div class="loading-title">LOADING</div>
      <div class="loading-what" id="loading-what">Preparing</div>
      <div class="loading-bar"><div id="loading-fill"></div></div>
      <div class="loading-tip" id="loading-tip"></div>
    </div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
