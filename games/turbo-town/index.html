<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turbo Town</title>
  <meta name="description" content="TURBO TOWN - a bright, bouncy 3D kart racer. Drift, boost and grab item boxes across 8 seasonal maps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="hud" class="hidden"></div>
  <div id="ui"></div>
  <div id="loading">
    <div class="loading-card">
      <div class="logo"><span class="logo-a">TURBO</span><span class="logo-b">TOWN</span></div>
      <div class="loading-bar"><div id="loading-fill"></div></div>
      <div class="loading-what" id="loading-what">Warming up the engines</div>
      <div class="loading-tip" id="loading-tip"></div>
    </div>
  </div>
  <noscript>TURBO TOWN needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
